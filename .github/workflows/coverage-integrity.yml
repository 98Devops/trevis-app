# Coverage Integrity Monitor (Phase 4C-A #3)
#
# Nightly read-only audit: replays the payment ledger for every ACTIVE student
# and asserts the stored coverage cache still matches. Fails the run (red ✖ +
# email from GitHub) if anything drifted, a coverage range is corrupt, or any
# student would lose days. A money system should constantly prove it's healthy.
#
# NOTE: this repo's active project lives in the trevis-production/ subfolder
# (Netlify base = trevis-production). All steps run there. This workflow MUST be
# at the REPOSITORY ROOT .github/workflows/ — GitHub Actions ignores nested ones.
#
# REQUIRED REPO SECRETS (Settings → Secrets and variables → Actions):
#   SUPABASE_URL          = https://<project>.supabase.co
#   SUPABASE_SERVICE_KEY  = service_role key (bypasses RLS; read-only here)
#
# The job NEVER writes — it runs `--report` (read-only), which exits non-zero on
# any problem. No --apply is ever invoked from CI.

name: Coverage Integrity Monitor

on:
  schedule:
    - cron: '0 2 * * *'   # 02:00 UTC daily
  workflow_dispatch: {}    # allow manual "Run workflow"

defaults:
  run:
    working-directory: trevis-production

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Prefer the reproducible `npm ci`; fall back to `npm install` if the lock
      # file ever desyncs (e.g. platform-specific WASM deps) so a lock hiccup can
      # never silently disable the coverage-integrity monitor.
      - name: Install deps
        run: npm ci || npm install

      - name: Run coverage integrity report (read-only)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/replay_portfolio_coverage.mjs --report
