  <text x="340" y="178" text-anchor="middle" font-family="'Sora', Arial, sans-serif" font-size="14" font-weight="400" letter-spacing="4" fill="#6B7280" style="fill:rgb(107, 114, 128);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Sora, Arial, sans-serif;font-size:14px;font-weight:400;text-anchor:middle;dominant-baseline:auto">STUDENT ACCOMMODATION · PROPERTY MANAGEMENT</text>

