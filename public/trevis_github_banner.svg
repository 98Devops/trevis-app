  <line x1="240" y1="194" x2="440" y2="194" stroke="#232836" stroke-width="1" style="fill:rgb(0, 0, 0);stroke:rgb(35, 40, 54);color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

