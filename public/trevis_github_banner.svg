  <text x="340" y="148" text-anchor="middle" font-family="'Sora', 'Arial Black', sans-serif" font-size="72" font-weight="800" letter-spacing="-2" fill="#F5A623" style="fill:rgb(245, 166, 35);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Sora, &quot;Arial Black&quot;, sans-serif;font-size:72px;font-weight:800;text-anchor:middle;dominant-baseline:auto">TREVIS</text>

