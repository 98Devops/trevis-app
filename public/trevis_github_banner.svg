  <text x="254" y="218" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="13" font-weight="700" fill="#E8EAF0" style="fill:rgb(232, 234, 240);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;IBM Plex Mono&quot;, monospace;font-size:13px;font-weight:700;text-anchor:middle;dominant-baseline:auto">4</text>
  <text x="254" y="233" text-anchor="middle" font-family="'Sora', Arial, sans-serif" font-size="10" letter-spacing="1" fill="#6B7280" style="fill:rgb(107, 114, 128);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Sora, Arial, sans-serif;font-size:10px;font-weight:400;text-anchor:middle;dominant-baseline:auto">PROPERTIES</text>

  <line x1="300" y1="208" x2="300" y2="238" stroke="#232836" stroke-width="1" style="fill:rgb(0, 0, 0);stroke:rgb(35, 40, 54);color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <text x="340" y="218" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="13" font-weight="700" fill="#E8EAF0" style="fill:rgb(232, 234, 240);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;IBM Plex Mono&quot;, monospace;font-size:13px;font-weight:700;text-anchor:middle;dominant-baseline:auto">140+</text>
  <text x="340" y="233" text-anchor="middle" font-family="'Sora', Arial, sans-serif" font-size="10" letter-spacing="1" fill="#6B7280" style="fill:rgb(107, 114, 128);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Sora, Arial, sans-serif;font-size:10px;font-weight:400;text-anchor:middle;dominant-baseline:auto">STUDENTS</text>

  <line x1="380" y1="208" x2="380" y2="238" stroke="#232836" stroke-width="1" style="fill:rgb(0, 0, 0);stroke:rgb(35, 40, 54);color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <text x="426" y="218" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="13" font-weight="700" fill="#22D3EE" style="fill:rgb(34, 211, 238);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;IBM Plex Mono&quot;, monospace;font-size:13px;font-weight:700;text-anchor:middle;dominant-baseline:auto">MVP</text>
  <text x="426" y="233" text-anchor="middle" font-family="'Sora', Arial, sans-serif" font-size="10" letter-spacing="1" fill="#6B7280" style="fill:rgb(107, 114, 128);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Sora, Arial, sans-serif;font-size:10px;font-weight:400;text-anchor:middle;dominant-baseline:auto">LIVE DEMO</text>

  <!-- Bottom stack -->
  <text x="340" y="263" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#333d4d" letter-spacing="2" style="fill:rgb(51, 61, 77);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;IBM Plex Mono&quot;, monospace;font-size:10px;font-weight:400;text-anchor:middle;dominant-baseline:auto">
    REACT · VITE · NETLIFY
